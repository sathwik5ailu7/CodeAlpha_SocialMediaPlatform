<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — Pulse</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="auth-body">
  <div class="auth-box">
    <div class="auth-header">
      <a href="/" class="brand"><i class="fas fa-bolt"></i> Pulse</a>
      <h2>Welcome Back</h2>
      <p>Sign in to your account</p>
    </div>

    <form id="loginForm" class="auth-form">
      <div class="form-group">
        <label><i class="fas fa-user"></i> Email or Username</label>
        <input type="text" id="emailOrUsername" placeholder="Enter username or email" required>
      </div>

      <div class="form-group">
        <label><i class="fas fa-lock"></i> Password</label>
        <input type="password" id="password" placeholder="Enter password" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Log In</button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a href="/register.html">Sign Up</a></p>
      <div class="demo-box">
        <strong>Demo Credentials:</strong>
        <p>Email: <code>sathwik@example.com</code></p>
        <p>Password: <code>demo123</code></p>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/js/utils.js"></script>
  <script>
    if (getToken()) window.location.href = '/';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';

      try {
        const res = await api('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({
            emailOrUsername: document.getElementById('emailOrUsername').value.trim(),
            password: document.getElementById('password').value
          })
        });

        localStorage.setItem('token', res.token);
        localStorage.setItem('user', JSON.stringify(res.user));
        showToast('Login successful! Redirecting...', 'success');
        setTimeout(() => window.location.href = '/', 800);
      } catch (err) {
        showToast(err.message || 'Login failed', 'error');
        btn.disabled = false;
        btn.innerHTML = 'Log In';
      }
    });
  </script>
</body>
</html>
