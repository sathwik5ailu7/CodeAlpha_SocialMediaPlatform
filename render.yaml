services:
  - type: web
    name: codealpha-social-media
    env: node
    plan: free
    buildCommand: npm install && node db/seed.js
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
